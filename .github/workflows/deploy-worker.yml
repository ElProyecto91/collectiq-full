name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Upload secrets to Cloudflare
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.CF_TELEGRAM_BOT_TOKEN }}" | wrangler secret put TELEGRAM_BOT_TOKEN --name collectiq-api
          echo "${{ secrets.CF_SUPABASE_SERVICE_ROLE_KEY }}" | wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name collectiq-api
          echo "${{ secrets.CF_GEMINI_API_KEY }}" | wrangler secret put GEMINI_API_KEY --name collectiq-api
          echo "${{ secrets.CF_APITCG_API_KEY }}" | wrangler secret put APITCG_API_KEY --name collectiq-api
          echo "${{ secrets.CF_EBAY_APP_ID }}" | wrangler secret put EBAY_APP_ID --name collectiq-api
          echo "${{ secrets.CF_EBAY_CERT_ID }}" | wrangler secret put EBAY_CERT_ID --name collectiq-api
          echo "${{ secrets.CF_POKEMONTCG_API_KEY }}" | wrangler secret put VITE_POKEMONTCG_API_KEY --name collectiq-api
          echo "${{ secrets.CF_CRON_SECRET }}" | wrangler secret put CRON_SECRET --name collectiq-api

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
