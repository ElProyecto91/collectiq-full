name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          wranglerVersion: '3.99.0'

      - name: Upload secrets to Cloudflare
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3.99.0 secret put TELEGRAM_BOT_TOKEN --name collectiq-api <<< "${{ secrets.CF_TELEGRAM_BOT_TOKEN }}"
          npx wrangler@3.99.0 secret put SUPABASE_SERVICE_ROLE_KEY --name collectiq-api <<< "${{ secrets.CF_SUPABASE_SERVICE_ROLE_KEY }}"
          npx wrangler@3.99.0 secret put GEMINI_API_KEY --name collectiq-api <<< "${{ secrets.CF_GEMINI_API_KEY }}"
          npx wrangler@3.99.0 secret put APITCG_API_KEY --name collectiq-api <<< "${{ secrets.CF_APITCG_API_KEY }}"
          npx wrangler@3.99.0 secret put EBAY_APP_ID --name collectiq-api <<< "${{ secrets.CF_EBAY_APP_ID }}"
          npx wrangler@3.99.0 secret put EBAY_CERT_ID --name collectiq-api <<< "${{ secrets.CF_EBAY_CERT_ID }}"
          npx wrangler@3.99.0 secret put VITE_POKEMONTCG_API_KEY --name collectiq-api <<< "${{ secrets.CF_POKEMONTCG_API_KEY }}"
          npx wrangler@3.99.0 secret put CRON_SECRET --name collectiq-api <<< "${{ secrets.CF_CRON_SECRET }}"
